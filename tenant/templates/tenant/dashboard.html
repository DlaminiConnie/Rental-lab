{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2 class="text-center"> Tenant Dashboard</h2>
    <p class="text-center subtitle">Welcome to your dashboard!</p>

    <div class="alert alert-success">
        You have successfully registered and logged in.
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;">
        <div class="card" style="text-align: center; padding: 1.5rem;">
            <h3> Browse Rooms</h3>
            <p>Find your perfect room</p>
            <a href="/rooms/" class="btn btn-primary">Browse</a>
        </div>

        <div class="card" style="text-align: center; padding: 1.5rem;">
            <h3> Messages</h3>
            <p>View your messages</p>
            <a href="#" class="btn btn-secondary">Messages</a>
        </div>

        <div class="card" style="text-align: center; padding: 1.5rem;">
            <h3> My Profile</h3>
            <p>Update your details</p>
            <a href="#" class="btn btn-secondary">Profile</a>
        </div>
    </div>

    <div style="margin-top: 2rem; text-align: center;">
        <a href="/landlord/logout/" class="btn btn-danger">Logout</a>
    </div>
</div>

{% endblock %}

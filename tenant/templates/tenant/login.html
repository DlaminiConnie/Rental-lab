
{% extends 'base.html' %}

{% block content %}

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"> Tenant Login</h2>
    <p class="text-center subtitle">Log in to find your perfect room</p>

    <form method="POST" action="{% url 'tenant:login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" placeholder="e.g., jane@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <div class="help-text">
                <a href="#">Forgot password?</a>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="text-center mt-3">
        Don't have an account? <a href="{% url 'tenant:register' %}">Register as a Tenant</a>
    </p>
</div>

{% endblock %}

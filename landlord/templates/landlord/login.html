{% extends 'base.html' %}

{% block content %}
    <div class="register-wrapper">
    <!-- Left side: Registration Form -->
    <div class="card">
        <h2>Login as a Landlord</h2>
        <p class="subtitle">Login your account to list your rooms and connect with tenants.</p>

        <form method="POST" enctype="multipart/form-data" action="{% url 'landlord:login' %}">
            {% csrf_token %}

            <h3 style="font-size: 1.1rem; font-weight: 600; margin-top: 1.8rem; margin-bottom: 0.3rem; color: #222;">Login Information</h3>
            <hr style="border: 0; border-top: 1px solid #ececec; margin: 0.8rem 0 1.5rem 0;">


            <div class="form-group">
                <label for="email">Email Address <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" placeholder="e.g., azwi@example.com" required>
                <div class="help-text">Login using your email address</div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-star">*</span></label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <div class="help-text">Enter your password to login</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login as Landlord</button>
        </form>

        <p class="text-center mt-3" style="border-top: 1px solid #efefef; padding-top: 1.8rem; color: #555;">
            Dont have an account? Create Account <a href="{% url 'landlord:register' %}" style="color: #ff5a5f; font-weight: 500;">Create Account</a>
        </p>
    </div>
{% endblock %}
